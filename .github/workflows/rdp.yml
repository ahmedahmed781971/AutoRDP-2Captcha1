name: Fixed-AutoRDP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  deploy:
    runs-on: windows-latest

    steps:
    - name: Setup RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!123" -Force)

    - name: Install Playit
      run: |
        Invoke-WebRequest -Uri "https://playit.gg/downloads/playit-windows-64-bit" -OutFile playit.exe
        Start-Process .\playit.exe -ArgumentList "--secret $env:PLAYIT_AUTH_KEY" -NoNewWindow -Wait

    - name: Setup 2Captcha
      run: |
        npm install 2captcha
        @"
        const solver = new (require('2captcha'))('8ce5dcfef586a13706557deebafd2e7f');
        setInterval(() => {
          solver.hcaptcha('SITE_KEY', 'https://example.com')
            .then(console.log)
            .catch(console.error)
        }, 5000);
        "@ > captcha.js
        Start-Process node -ArgumentList "captcha.js" -WindowStyle Hidden

    - name: Keep Alive
      run: ping -t 127.0.0.1
